<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Team Contribution</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f7ff;
      color: #182033;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      box-sizing: border-box;
    }

    main {
      width: min(100%, 34rem);
      padding: 2rem;
      border: 1px solid #dfe3f0;
      border-radius: 1.25rem;
      background: #ffffff;
      box-shadow: 0 1rem 2.5rem rgba(40, 52, 95, 0.12);
    }

    h1 {
      margin: 0 0 0.5rem;
      font-size: clamp(2rem, 7vw, 3rem);
      letter-spacing: -0.04em;
    }

    p {
      color: #596174;
    }

    button {
      margin-top: 0.75rem;
      padding: 0.75rem 1rem;
      border: 0;
      border-radius: 0.75rem;
      background: #4f46d9;
      color: #ffffff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: #4138c2;
    }

    button:focus-visible,
    a:focus-visible {
      outline: 3px solid #9ca3ff;
      outline-offset: 3px;
    }

    #contributor-student-id {
      min-height: 1.5rem;
      margin: 1.25rem 0;
      font-weight: 700;
      color: #182033;
    }

    a {
      color: #4037bd;
      font-weight: 650;
    }
  </style>
</head>
<body>
  <main>
    <h1>Team Contribution</h1>
    <p>This page was added through a GitHub Pull Request.</p>

    <button id="load-contributor" type="button">Show Contributor</button>
    <p id="contributor-student-id" aria-live="polite"></p>

    <a href="index.html">Back to Task Manager</a>
  </main>

  <script>
    const loadButton = document.getElementById("load-contributor");
    const contributorOutput = document.getElementById("contributor-student-id");

    loadButton.addEventListener("click", async () => {
      loadButton.disabled = true;
      contributorOutput.textContent = "Loading contributor...";

      try {
        const response = await fetch("contribution.json", { cache: "no-store" });
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const contribution = await response.json();
        if (!contribution.contributorStudentId) {
          throw new Error("Missing contributorStudentId");
        }

        contributorOutput.textContent = `Contributor Student ID: ${contribution.contributorStudentId}`;
      } catch (error) {
        contributorOutput.textContent = `Could not load contributor information: ${error.message}`;
      } finally {
        loadButton.disabled = false;
      }
    });
  </script>
</body>
</html>
